# 本地规则索引（v2 sections 结构，需求 §11.10）
# AI 助手按 tasks / paths 按需加载以下文档，避免一次性注入过多上下文

sections:
  - id: local-business
    path: business.md
    loadWhen:
      tasks:
        - requirement-analysis
        - feature-development
        - bug-fix

  - id: local-architecture
    path: architecture.md
    loadWhen:
      tasks:
        - feature-development
        - refactor
        - code-review
      paths:
        - "**/controller/**"
        - "**/service/**"

  - id: local-protected
    path: protected-files.md
    alwaysLoad: true
