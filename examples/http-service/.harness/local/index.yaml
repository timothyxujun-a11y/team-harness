# 本地规则索引
# AI 助手按需加载以下文档，避免一次性注入过多上下文

documents:
  - name: business
    file: business.md
    description: 用户服务与订单服务的业务领域说明，包含领域模型、状态机、业务规则
    keywords:
      - 用户管理
      - 订单查询
      - API 版本化
      - 状态枚举
    priority: high
    loadWhen:
      - feature-development
      - bug-fix
      - code-review

  - name: architecture
    file: architecture.md
    description: 项目分层架构、包结构、技术选型、依赖关系说明
    keywords:
      - 分层架构
      - 包结构
      - Controller
      - Service
      - Mapper
      - MapStruct
    priority: medium
    loadWhen:
      - feature-development
      - refactor
      - code-review

rules:
  maxRules: 12
  description: 本地任务规则上限 12 条，优先加载与当前任务类型匹配的规则
