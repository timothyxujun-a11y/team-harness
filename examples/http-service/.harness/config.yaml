apiVersion: harness.company.io/v1
kind: HarnessConfig

project:
  name: http-service-example
  description: 基于 Spring Boot 的 HTTP API 服务，提供用户管理和订单查询接口
  owners:
    team: platform-team

runtime:
  language: java
  javaVersion: "17"
  buildTool: maven
  defaultBranch: main

profiles:
  - java-common
  - spring-http

build:
  compileCommand: ./mvnw clean compile -DskipTests
  testCommand: ./mvnw test
  packageCommand: ./mvnw clean package -DskipTests

quality:
  diffCoverage:
    enabled: true
    threshold: 80
    baseBranch: origin/main

context:
  taskRules:
    maxRules: 12
  codeReview:
    maxRules: 15

localRules:
  main: CLAUDE.local.md
  index: .harness/local/index.yaml
