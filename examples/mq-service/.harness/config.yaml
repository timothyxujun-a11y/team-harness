apiVersion: harness.company.io/v1
kind: HarnessConfig

project:
  name: mq-service-example
  description: 基于 Spring Boot + RocketMQ 的异步消息处理服务，处理订单状态变更通知
  owners:
    team: platform-team

runtime:
  language: java
  javaVersion: "8"
  buildTool: maven
  defaultBranch: main

profiles:
  - java-common
  - spring-mq
  - legacy-java8

build:
  compileCommand: ./mvnw clean compile -DskipTests
  testCommand: ./mvnw test
  packageCommand: ./mvnw clean package -DskipTests

quality:
  diffCoverage:
    enabled: true
    threshold: 80
    baseBranch: origin/main

context:
  taskRules:
    maxRules: 12
  codeReview:
    maxRules: 15

localRules:
  main: CLAUDE.local.md
  index: .harness/local/index.yaml
