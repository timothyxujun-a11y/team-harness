# 本地规则索引
# AI 助手按需加载以下文档，避免一次性注入过多上下文

documents:
  - name: business
    file: business.md
    description: 日终对账与报表生成业务领域说明，包含对账规则、报表类型、批处理策略、告警机制
    keywords:
      - 日终对账
      - 报表生成
      - Quartz 调度
      - 批处理
      - 断点续跑
    priority: high
    loadWhen:
      - feature-development
      - bug-fix
      - code-review

  - name: architecture
    file: architecture.md
    description: 项目分层架构、Quartz 集群配置、分布式锁、包结构、测试架构说明
    keywords:
      - 分层架构
      - Quartz
      - 分布式锁
      - Redis
      - JDBC JobStore
    priority: medium
    loadWhen:
      - feature-development
      - refactor
      - code-review

rules:
  maxRules: 12
  description: 本地任务规则上限 12 条，优先加载与当前任务类型匹配的规则
