apiVersion: harness.company.io/v1
kind: HarnessConfig

project:
  name: legacy-java8-example
  description: 基于 Spring + Quartz 的定时任务服务，负责日终对账和报表生成
  owners:
    team: platform-team

runtime:
  language: java
  javaVersion: "8"
  buildTool: maven
  defaultBranch: main

profiles:
  - java-common
  - spring-job
  - legacy-java8

build:
  compileCommand: ./mvnw clean compile -DskipTests
  testCommand: ./mvnw test
  packageCommand: ./mvnw clean package -DskipTests

quality:
  diffCoverage:
    enabled: true
    threshold: 80
    baseBranch: origin/main

context:
  taskRules:
    maxRules: 12
  codeReview:
    maxRules: 15

localRules:
  main: CLAUDE.local.md
  index: .harness/local/index.yaml
