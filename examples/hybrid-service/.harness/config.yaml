apiVersion: harness.company.io/v1
kind: HarnessConfig

project:
  name: hybrid-service-example
  description: 税金计算服务，同时提供 HTTP API 和 MQ 消息处理能力
  owners:
    team: platform-team

runtime:
  language: java
  javaVersion: "11"
  buildTool: maven
  defaultBranch: main

profiles:
  - java-common
  - spring-http
  - spring-mq

build:
  compileCommand: ./mvnw clean compile -DskipTests
  testCommand: ./mvnw test
  packageCommand: ./mvnw clean package -DskipTests

quality:
  diffCoverage:
    enabled: true
    threshold: 80
    baseBranch: origin/main

context:
  taskRules:
    maxRules: 12
  codeReview:
    maxRules: 15

localRules:
  main: CLAUDE.local.md
  index: .harness/local/index.yaml
