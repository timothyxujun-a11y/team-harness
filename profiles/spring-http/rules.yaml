rules:
  # ============= Controller 架构 =============
  - id: HTTP-ARCH-001
    title: Controller 职责边界
    description: Controller 层应只负责参数接收、校验、调用 Service、返回结果，不得承载核心业务逻辑
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-http
      paths:
        include:
          - "**/controller/**/*.java"
      annotations:
        - RestController
        - Controller
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/controller.md
    context:
      priority: high
      estimatedTokens: 450

  - id: HTTP-ARCH-002
    title: 禁止 Controller 直接访问数据库
    description: Controller 不得直接依赖 DAO/Repository 层，数据访问必须通过 Service 层完成
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-http
      paths:
        include:
          - "**/controller/**/*.java"
      annotations:
        - RestController
        - Controller
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/controller.md
    context:
      priority: high
      estimatedTokens: 350

  - id: HTTP-ARCH-003
    title: Controller 注解规范
    description: Controller 类必须使用 @RestController 注解，并使用 @RequestMapping 定义统一路径前缀
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-http
      paths:
        include:
          - "**/controller/**/*.java"
      annotations:
        - RestController
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/controller.md
    context:
      priority: high
      estimatedTokens: 300

  # ============= 参数校验 =============
  - id: HTTP-VAL-001
    title: 参数校验（JSR-303）
    description: Controller 入参必须使用 JSR-303 注解进行校验，结合 @Valid 或 @Validated 触发校验
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-http
      paths:
        include:
          - "**/controller/**/*.java"
          - "**/dto/**/*.java"
          - "**/request/**/*.java"
          - "**/vo/**/*.java"
      annotations:
        - RestController
        - Controller
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/validation.md
    context:
      priority: high
      estimatedTokens: 400

  - id: HTTP-VAL-002
    title: 自定义校验注解
    description: 当 JSR-303 内置注解无法满足需求时，应在 common 模块封装自定义校验注解，保持业务代码整洁
    severity: warning
    enforced: false
    selectors:
      profiles:
        - spring-http
      paths:
        include:
          - "**/controller/**/*.java"
          - "**/dto/**/*.java"
          - "**/request/**/*.java"
          - "**/vo/**/*.java"
          - "**/common/**/validator/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/validation.md
    context:
      priority: medium
      estimatedTokens: 500

  # ============= 响应格式 =============
  - id: HTTP-RESP-001
    title: 统一响应体结构
    description: 所有 API 必须使用统一响应体结构包装返回数据，包含 code、message、data 字段
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-http
      paths:
        include:
          - "**/controller/**/*.java"
          - "**/common/**/Result/*.java"
          - "**/common/**/R.java"
      annotations:
        - RestController
        - Controller
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/response.md
    context:
      priority: high
      estimatedTokens: 400

  - id: HTTP-RESP-002
    title: 错误码体系与分页响应
    description: 必须建立统一的业务错误码体系，分页接口必须使用标准分页响应格式
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-http
      paths:
        include:
          - "**/controller/**/*.java"
          - "**/common/**/Result/*.java"
          - "**/common/**/R.java"
          - "**/common/**/exception/**/*.java"
      annotations:
        - RestController
        - Controller
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/response.md
    context:
      priority: high
      estimatedTokens: 500

  # ============= API 兼容性 =============
  - id: HTTP-COMPAT-001
    title: 不得删除已有 API 或修改字段含义
    description: 不得删除已发布的 API 端点，不得修改已有响应字段的名称或含义，避免破坏下游调用方
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-http
      paths:
        include:
          - "**/controller/**/*.java"
          - "**/dto/**/*.java"
          - "**/request/**/*.java"
          - "**/vo/**/*.java"
          - "**/response/**/*.java"
      annotations:
        - RestController
        - Controller
      tasks:
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/compatibility.md
    context:
      priority: high
      estimatedTokens: 350

  - id: HTTP-COMPAT-002
    title: 新增字段兼容与版本化管理
    description: 响应新增字段必须提供合理默认值，大型变更应通过 URL 版本号或 Header 进行 API 版本管理
    severity: warning
    enforced: false
    selectors:
      profiles:
        - spring-http
      paths:
        include:
          - "**/controller/**/*.java"
          - "**/dto/**/*.java"
          - "**/request/**/*.java"
          - "**/vo/**/*.java"
          - "**/response/**/*.java"
      annotations:
        - RestController
        - Controller
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/compatibility.md
    context:
      priority: medium
      estimatedTokens: 400

  # ============= OpenAPI 文档 =============
  - id: HTTP-DOC-001
    title: OpenAPI 文档注解
    description: 所有 Controller 及其接口必须添加 Swagger/Knife4j 文档注解，确保 API 文档自动生成可用
    severity: warning
    enforced: false
    selectors:
      profiles:
        - spring-http
      paths:
        include:
          - "**/controller/**/*.java"
          - "**/dto/**/*.java"
          - "**/request/**/*.java"
          - "**/vo/**/*.java"
      annotations:
        - RestController
        - Controller
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/openapi.md
    context:
      priority: medium
      estimatedTokens: 400
