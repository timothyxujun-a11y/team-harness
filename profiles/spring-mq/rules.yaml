# spring-mq 规则集

rules:
  # ==================== Consumer 入口规范 ====================
  - id: MQ-CONS-001
    title: Consumer 必须显式声明消费组与 Topic
    description: 所有消息消费者必须通过 @RocketMQMessageListener 或 @KafkaListener 显式指定 consumerGroup 和 topic，禁止使用通配符订阅生产环境 Topic。
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-mq
      paths:
        include:
          - "src/main/java/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/consumer.md
    context:
      priority: high
      estimatedTokens: 400

  - id: MQ-CONS-002
    title: Consumer 消费逻辑必须捕获异常并返回状态
    description: Consumer 消费方法内部必须 try-catch 业务异常，根据业务语义返回 ConsumeConcurrentlyStatus 或 Acknowledgment，禁止异常直接向上抛出导致无限重试。
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-mq
      paths:
        include:
          - "src/main/java/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/consumer.md
    context:
      priority: high
      estimatedTokens: 400

  - id: MQ-CONS-003
    title: Consumer 必须设置合理的并发消费线程数
    description: Consumer 必须显式配置 consumeThreadMin/consumeThreadMax 或 concurrency 属性，禁止使用默认值在生产环境运行。
    severity: warning
    enforced: false
    selectors:
      profiles:
        - spring-mq
      paths:
        include:
          - "src/main/java/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/consumer.md
    context:
      priority: medium
      estimatedTokens: 350

  # ==================== Producer 封装规范 ====================
  - id: MQ-PROD-001
    title: Producer 发送必须封装统一的发送服务
    description: 禁止在业务代码中直接注入 RocketMQTemplate/KafkaTemplate 发送消息，必须通过统一的 MqProducerService 封装层发送，以便统一处理日志、Trace 和异常。
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-mq
      paths:
        include:
          - "src/main/java/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/producer.md
    context:
      priority: high
      estimatedTokens: 400

  - id: MQ-PROD-002
    title: Producer 同步发送必须设置超时与重试次数
    description: 同步发送消息时必须显式设置 timeout 和 retryTimes，禁止使用默认超时值。异步发送必须提供回调处理失败场景。
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-mq
      paths:
        include:
          - "src/main/java/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/producer.md
    context:
      priority: high
      estimatedTokens: 400

  # ==================== 消息幂等 ====================
  - id: MQ-IDEMP-001
    title: Consumer 必须实现幂等性校验
    description: 所有 Consumer 必须在业务处理前基于消息唯一 ID（msgId / 业务唯一键）进行幂等校验，防止重复消费。幂等存储推荐使用 Redis SETNX 或数据库唯一索引。
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-mq
      paths:
        include:
          - "src/main/java/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/idempotency.md
    context:
      priority: high
      estimatedTokens: 450

  - id: MQ-IDEMP-002
    title: 幂等键必须使用业务唯一标识而非 msgId
    description: 幂等校验的键应优先使用业务唯一标识（如订单号+操作类型），而非 MQ 中间件生成的 msgId，因为 msgId 在极端情况下可能重复。
    severity: warning
    enforced: false
    selectors:
      profiles:
        - spring-mq
      paths:
        include:
          - "src/main/java/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/idempotency.md
    context:
      priority: medium
      estimatedTokens: 350

  # ==================== 重试与死信处理 ====================
  - id: MQ-RETRY-001
    title: 必须配置合理的重试次数与退避策略
    description: Consumer 必须显式配置最大重试次数（建议不超过 5 次），并采用指数退避策略。禁止使用无限重试导致消息积压。
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-mq
      paths:
        include:
          - "src/main/java/**/*.java"
          - "src/main/resources/**/*.yml"
          - "src/main/resources/**/*.yaml"
          - "src/main/resources/**/*.properties"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/retry.md
    context:
      priority: high
      estimatedTokens: 400

  - id: MQ-RETRY-002
    title: 必须实现死信队列监控与告警
    description: 系统必须对死信队列（DLQ）实现监控与告警机制，死信消息需提供人工介入处理入口或自动补偿流程。
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-mq
      paths:
        include:
          - "src/main/java/**/*.java"
          - "src/main/resources/**/*.yml"
          - "src/main/resources/**/*.yaml"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/retry.md
    context:
      priority: high
      estimatedTokens: 400

  # ==================== 消息 Schema 兼容性 ====================
  - id: MQ-SCHEMA-001
    title: 消息体 Schema 变更必须保持向后兼容
    description: 消息体（POJO/JSON）字段变更必须保持向后兼容——新增字段需提供默认值，禁止删除或重命名已有字段。推荐使用 Schema Registry 管理消息版本。
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-mq
      paths:
        include:
          - "src/main/java/**/message/**/*.java"
          - "src/main/java/**/dto/**/*.java"
          - "src/main/java/**/event/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/schema.md
    context:
      priority: high
      estimatedTokens: 400
