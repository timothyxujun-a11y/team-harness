rules:
  # ==================== 命名规范 ====================
  - id: JAVA-CODE-001
    title: 类命名使用 PascalCase
    description: 所有类、接口、枚举、注解类型必须使用 PascalCase 命名法，名称应准确表达类型含义
    severity: error
    enforced: false
    selectors:
      profiles:
        - java-common
      paths:
        include:
          - "**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/naming.md
    context:
      priority: high
      estimatedTokens: 400

  - id: JAVA-CODE-002
    title: 方法命名使用 camelCase
    description: 方法名使用 camelCase 命名法，应以动词开头，准确表达方法行为
    severity: error
    enforced: false
    selectors:
      profiles:
        - java-common
      paths:
        include:
          - "**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/naming.md
    context:
      priority: high
      estimatedTokens: 400

  - id: JAVA-CODE-003
    title: 常量与包命名规范
    description: 常量使用 UPPER_SNAKE_CASE，包名全小写不使用下划线，测试类以 Test 结尾
    severity: error
    enforced: false
    selectors:
      profiles:
        - java-common
      paths:
        include:
          - "**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/naming.md
    context:
      priority: medium
      estimatedTokens: 400

  # ==================== 异常处理 ====================
  - id: JAVA-EXC-001
    title: 自定义业务异常继承 RuntimeException
    description: 自定义业务异常应继承 RuntimeException 而非 Exception，避免强制声明 checked exception
    severity: error
    enforced: false
    selectors:
      profiles:
        - java-common
      paths:
        include:
          - "**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/exception.md
    context:
      priority: high
      estimatedTokens: 500

  - id: JAVA-EXC-002
    title: 禁止捕获异常后忽略
    description: 不得捕获 Exception 后空处理或仅打印日志，必须进行合理的恢复或重新抛出
    severity: error
    enforced: false
    selectors:
      profiles:
        - java-common
      paths:
        include:
          - "**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/exception.md
    context:
      priority: high
      estimatedTokens: 500

  - id: JAVA-EXC-003
    title: 异常信息必须包含上下文与 Controller 统一处理
    description: 异常消息必须包含业务上下文信息；Controller 层应使用 @ControllerAdvice 统一处理异常
    severity: error
    enforced: false
    selectors:
      profiles:
        - java-common
      paths:
        include:
          - "**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/exception.md
    context:
      priority: high
      estimatedTokens: 500

  # ==================== 日志规范 ====================
  - id: JAVA-LOG-001
    title: 使用 SLF4J + Logback 日志框架
    description: 必须使用 SLF4J 作为日志门面，Logback 作为实现；禁止使用 System.out.println
    severity: error
    enforced: false
    selectors:
      profiles:
        - java-common
      paths:
        include:
          - "**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/logging.md
    context:
      priority: high
      estimatedTokens: 450

  - id: JAVA-LOG-002
    title: 日志级别使用规范
    description: 按场景正确使用 DEBUG/INFO/WARN/ERROR 四个级别，避免滥用 ERROR 和 WARN
    severity: warn
    enforced: false
    selectors:
      profiles:
        - java-common
      paths:
        include:
          - "**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/logging.md
    context:
      priority: medium
      estimatedTokens: 450

  - id: JAVA-LOG-003
    title: 敏感信息不得记录日志
    description: 密码、Token、身份证号等敏感信息不得以明文记录到日志中，需脱敏处理
    severity: error
    enforced: false
    selectors:
      profiles:
        - java-common
      paths:
        include:
          - "**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/logging.md
    context:
      priority: high
      estimatedTokens: 450

  # ==================== 单元测试 ====================
  - id: JAVA-TEST-001
    title: 测试框架使用 JUnit 4 + Mockito + AssertJ
    description: 单元测试固定使用 JUnit 4 + Mockito + AssertJ 技术栈，禁止使用 JUnit 5 或 TestNG
    severity: error
    enforced: false
    selectors:
      profiles:
        - java-common
      paths:
        include:
          - "**/*Test.java"
          - "**/*Tests.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/testing.md
    context:
      priority: high
      estimatedTokens: 600

  - id: JAVA-TEST-002
    title: 禁止单元测试启动 Spring 容器
    description: 单元测试禁止使用 @SpringBootTest、@RunWith(SpringRunner.class)、@ContextConfiguration 等启动 Spring 容器的注解
    severity: error
    enforced: false
    selectors:
      profiles:
        - java-common
      paths:
        include:
          - "**/*Test.java"
          - "**/*Tests.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/testing.md
    context:
      priority: high
      estimatedTokens: 600

  - id: JAVA-TEST-003
    title: AAA 结构与测试命名规范
    description: 测试方法使用 Arrange-Act-Assert 结构，方法命名采用 should期望行为When条件 格式，使用 when().thenReturn() 进行 Mock
    severity: error
    enforced: false
    selectors:
      profiles:
        - java-common
      paths:
        include:
          - "**/*Test.java"
          - "**/*Tests.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/testing.md
    context:
      priority: high
      estimatedTokens: 600

  - id: JAVA-TEST-004
    title: 测试最小化运行与覆盖率要求
    description: 只运行改动的测试类，使用 @RunWith(MockitoJUnitRunner.class)，核心逻辑行覆盖率不低于 80%
    severity: warn
    enforced: false
    selectors:
      profiles:
        - java-common
      paths:
        include:
          - "**/*Test.java"
          - "**/*Tests.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/testing.md
    context:
      priority: medium
      estimatedTokens: 600
