apiVersion: harness.company.io/v1
kind: HarnessProfile

metadata:
  name: spring-job
  version: 1.0.0
  description: Spring 定时任务（Job）开发规范，涵盖 Job 入口、分布式锁、批处理、失败重试与断点续跑

compatibility:
  languages:
    - java
  javaVersions:
    - "8"
    - "11"
    - "17"
    - "21"
  buildTools:
    - maven

dependsOn:
  - java-common

conflictsWith: []

content:
  index: index.md
  rules: rules.yaml
  ruleDirectory: rules
