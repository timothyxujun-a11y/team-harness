# spring-job 规则集

rules:
  # ==================== Job 入口规范 ====================
  - id: JOB-ENTRY-001
    title: Job 必须使用统一调度框架而非原生 @Scheduled
    description: 定时任务必须使用 XXL-JOB / ElasticJob 等分布式调度框架，禁止在生产环境使用 Spring 原生 @Scheduled 注解（无法动态调度、无执行日志、无失败告警）。
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-job
      paths:
        include:
          - "src/main/java/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/job-entry.md
    context:
      priority: high
      estimatedTokens: 400

  - id: JOB-ENTRY-002
    title: Job 执行入口必须记录执行日志与执行结果
    description: Job 执行方法必须记录开始时间、结束时间、处理数据量、成功/失败数量等关键指标，并通过调度框架返回执行结果。
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-job
      paths:
        include:
          - "src/main/java/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/job-entry.md
    context:
      priority: high
      estimatedTokens: 400

  # ==================== 分布式锁 ====================
  - id: JOB-LOCK-001
    title: 分布式 Job 必须获取分布式锁防止重复执行
    description: 在多节点部署环境下，Job 执行前必须获取分布式锁（Redis/DB/ZooKeeper），确保同一时间只有一个节点执行任务。
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-job
      paths:
        include:
          - "src/main/java/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/distributed-lock.md
    context:
      priority: high
      estimatedTokens: 450

  - id: JOB-LOCK-002
    title: 分布式锁必须设置合理的超时与自动续期
    description: 分布式锁必须设置过期时间防止死锁，且在任务执行时间较长时启用锁续期（Watchdog）机制，避免锁过期导致并发执行。
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-job
      paths:
        include:
          - "src/main/java/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/distributed-lock.md
    context:
      priority: high
      estimatedTokens: 400

  # ==================== 批处理 ====================
  - id: JOB-BATCH-001
    title: 批量处理必须分页执行，禁止一次性加载全量数据
    description: Job 批量处理数据时必须分页/分批拉取，单批次数据量建议不超过 1000 条，禁止一次性加载全量数据到内存。
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-job
      paths:
        include:
          - "src/main/java/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/batch.md
    context:
      priority: high
      estimatedTokens: 450

  - id: JOB-BATCH-002
    title: 批处理必须记录处理进度，支持断点续跑
    description: 批处理 Job 必须将处理进度（当前页码/最后处理的 ID）持久化，当 Job 中断后重启时能从断点继续执行，而非从头开始。
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-job
      paths:
        include:
          - "src/main/java/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/batch.md
    context:
      priority: high
      estimatedTokens: 400

  # ==================== 失败重试与断点续跑 ====================
  - id: JOB-RETRY-001
    title: Job 失败必须支持重试并保留执行上下文
    description: Job 执行失败时必须支持自动重试（建议 3 次），重试时需保留执行上下文（已处理进度），避免数据不一致。重试耗尽后需触发告警。
    severity: error
    enforced: false
    selectors:
      profiles:
        - spring-job
      paths:
        include:
          - "src/main/java/**/*.java"
      tasks:
        - feature-development
        - refactor
        - code-review
    checks:
      agent: true
      ci: false
      documentation: true
    content:
      path: rules/retry.md
    context:
      priority: high
      estimatedTokens: 450
